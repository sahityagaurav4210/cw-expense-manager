server:
  port: 8080
  host: 0.0.0.0

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:9123"
              - "http://localhost:3000"
              - "http://localhost:3001"
              - "http://localhost:4000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: backend-service
          uri: ${BACKEND_URI:http://localhost:5000}
          predicates:
            - Path=/api/v1/**

gateway:
  rate-limiter:
    enabled: true
    max-requests: 100
    window-seconds: 60 # 1 minute window (100 requests per minute per IP)

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    com.cw.expensetracker: DEBUG
  file:
    name: logs/api-gateway.log
