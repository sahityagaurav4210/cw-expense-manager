server:
  port: 8080
  host: 0.0.0.0

spring:
  application:
    name: api-gateway
  profiles:
    active: ${APP_ENV:local}


gateway:
  rate-limiter:
    enabled: true
    max-requests: 100
    window-seconds: 60 # 1 minute window (100 requests per minute per IP)

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    com.cw.expensetracker: DEBUG
  file:
    name: logs/api-gateway.log
