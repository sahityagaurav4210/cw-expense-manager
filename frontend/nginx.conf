server {
  listen 9123;
  server_name expense-tracker.codingworks.in;

  root /usr/share/nginx/html;
  index index.html;

  # Built-in per-request unique 128-bit random nonce
  set $cspNonce $request_id;

  # Content-Security-Policy with Dynamic Nonce and Whitelisted External Sources
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$cspNonce'; style-src 'self' 'nonce-$cspNonce' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: http://localhost:11905 http://localhost:11906 http://localhost:4000 http://localhost:5000 https://expense-tracker.codingworks.in; connect-src 'self' http://localhost:4000 http://localhost:5000 http://localhost:11905 http://localhost:11906 https://expense-tracker.codingworks.in ws://localhost:* wss://localhost:*; media-src 'self' blob: http://localhost:11905 http://localhost:11906; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self';" always;

  # Additional Recommended Security Headers
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location / {
    sub_filter '__CSP_NONCE__' $cspNonce;
    sub_filter_once off;
    sub_filter_types text/html;
    try_files $uri /index.html;
  }

  location = /404.html {
    root /usr/share/nginx/html;
  }
}